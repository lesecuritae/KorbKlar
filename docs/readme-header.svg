<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">KorbKlar</title>
  <desc id="desc">KorbKlar vergleicht regionale Supermarktangebote und macht Preise direkt vergleichbar.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f8f4"/>
      <stop offset="1" stop-color="#dcefe5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" rx="32" fill="url(#bg)"/>
  <circle cx="1082" cy="64" r="176" fill="#c8e5d4" opacity=".58"/>
  <circle cx="52" cy="454" r="152" fill="#ffffff" opacity=".56"/>

  <g transform="translate(92 106)">
    <rect width="120" height="120" rx="29" fill="#116149"/>
    <path d="M28 50h64l-8 44H36l-8-44Z" fill="#fff"/>
    <path d="M41 50c2-17 8-25 19-25s17 8 19 25" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
    <path d="m47 70 8 8 19-21" fill="none" stroke="#116149" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="244" y="178" fill="#14201b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="76" font-weight="760" letter-spacing="-3">Korb<tspan fill="#116149">Klar</tspan></text>
  <text x="98" y="286" fill="#405249" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="30">Regionale Angebote. Klare Preise.</text>
  <text x="98" y="330" fill="#64736b" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="19">Selbst gehostet · ohne Konto · für regionale Wochenangebote</text>

  <!-- Shadow drawn as a plain rounded rectangle so the artwork also works in conservative SVG renderers. -->
  <rect x="754" y="119" width="352" height="264" rx="24" fill="#0a3c2d" opacity=".10"/>
  <g transform="translate(742 105)" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <rect width="352" height="264" rx="24" fill="#fff" stroke="#d9e6df"/>
    <text x="28" y="46" fill="#63716a" font-size="16" font-weight="650" letter-spacing="1.2">PREISVERGLEICH</text>
    <text x="28" y="86" fill="#14201b" font-size="25" font-weight="720">Naturjoghurt</text>
    <text x="28" y="116" fill="#63716a" font-size="17">500 g · diese Woche</text>
    <path d="M28 143h296" stroke="#dce5e0"/>
    <text x="28" y="184" fill="#14201b" font-size="18">Markt A</text>
    <text x="324" y="184" text-anchor="end" fill="#116149" font-size="26" font-weight="760">0,99 €</text>
    <text x="28" y="228" fill="#14201b" font-size="18">Markt B</text>
    <text x="324" y="228" text-anchor="end" fill="#63716a" font-size="26" font-weight="700">1,29 €</text>
  </g>
</svg>
