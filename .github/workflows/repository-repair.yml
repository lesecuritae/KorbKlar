name: Repository repair

on:
  push:
    paths:
      - '.github/workflows/repository-repair.yml'

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Prepare exact public tree
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > /tmp/expected.txt <<'EOF'
          .dockerignore
          .env.example
          .github/workflows/tests.yml
          .gitignore
          Dockerfile
          LICENSE
          README.md
          RELEASE_NOTES.md
          compose.yml
          pyproject.toml
          src/supermarkt/__init__.py
          src/supermarkt/asgi.py
          src/supermarkt/assets.py
          src/supermarkt/cache.py
          src/supermarkt/common.py
          src/supermarkt/compare.py
          src/supermarkt/config.py
          src/supermarkt/diagnostics.py
          src/supermarkt/http.py
          src/supermarkt/images.py
          src/supermarkt/loyalty.py
          src/supermarkt/models.py
          src/supermarkt/presentation.py
          src/supermarkt/region.py
          src/supermarkt/security.py
          src/supermarkt/service.py
          src/supermarkt/sources/__init__.py
          src/supermarkt/sources/aldi.py
          src/supermarkt/sources/edeka.py
          src/supermarkt/sources/kaufland.py
          src/supermarkt/sources/marktguru.py
          src/supermarkt/sources/rewe.py
          src/supermarkt/ui.py
          src/supermarkt/version.py
          src/supermarkt/web.py
          tests/integration/test_live_sources.py
          tests/test_cache.py
          tests/test_common.py
          tests/test_config.py
          tests/test_diagnostics.py
          tests/test_edeka_week.py
          tests/test_images.py
          tests/test_kaufland.py
          tests/test_loyalty.py
          tests/test_marktguru.py
          tests/test_privacy.py
          tests/test_region.py
          tests/test_release_cleanliness.py
          tests/test_request.py
          tests/test_rewe.py
          tests/test_routing.py
          tests/test_security.py
          tests/test_web.py
          EOF
          sed -i 's/^          //' /tmp/expected.txt
          sort -u /tmp/expected.txt -o /tmp/expected.txt

          # Keep only the 53 files that belong to the release. This removes all
          # temporary payloads and every old finalize/publish workflow.
          while IFS= read -r -d '' f; do
            rel="${f#./}"
            if ! grep -Fxq "$rel" /tmp/expected.txt; then
              rm -f -- "$f"
            fi
          done < <(find . -path './.git' -prune -o -type f -print0)

          mkdir -p .github/workflows
          cat > .github/workflows/tests.yml <<'EOF'
          name: Tests

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - name: Checkout
                  uses: actions/checkout@v6

                - name: Python 3.13
                  uses: actions/setup-python@v6
                  with:
                    python-version: '3.13'
                    cache: pip

                - name: Install
                  run: |
                    python -m pip install --upgrade pip
                    pip install -e '.[dev]'

                - name: Compile
                  run: python -m compileall -q src tests

                - name: Test
                  run: pytest -q -m 'not live' -p no:cacheprovider

                - name: Build wheel
                  run: python -m pip wheel --no-build-isolation --no-deps . -w /tmp/wheel

                - name: Docker build
                  run: docker compose build
          EOF
          sed -i 's/^          //' .github/workflows/tests.yml

          : > /tmp/diagnostics.txt
          missing=0
          while IFS= read -r f; do
            if [[ ! -f "$f" ]]; then
              echo "MISSING: $f" >> /tmp/diagnostics.txt
              missing=1
            fi
          done < /tmp/expected.txt

          actual_count="$(find . -path './.git' -prune -o -type f -print | sed 's#^./##' | wc -l | tr -d ' ')"
          expected_count="$(wc -l < /tmp/expected.txt | tr -d ' ')"
          echo "Expected files: $expected_count" >> /tmp/diagnostics.txt
          echo "Actual files:   $actual_count" >> /tmp/diagnostics.txt

          if [[ "$missing" -ne 0 || "$actual_count" -ne 53 ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          grep -Fq 'BSD 3-Clause License' LICENSE || { echo 'LICENSE: BSD-3-Clause text missing' >> /tmp/diagnostics.txt; echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0; }
          grep -Fq 'Copyright (c) 2026 lesecuritae für Tarnkappe.info' LICENSE || { echo 'LICENSE: copyright line missing' >> /tmp/diagnostics.txt; echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0; }
          grep -Fq 'Grocy' README.md || { echo 'README: Grocy roadmap missing' >> /tmp/diagnostics.txt; echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0; }
          grep -Fq 'KitchenOwl' README.md || { echo 'README: KitchenOwl roadmap missing' >> /tmp/diagnostics.txt; echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0; }
          grep -Fq 'https://tarnkappe.info/spenden/' README.md || { echo 'README: donation URL missing' >> /tmp/diagnostics.txt; echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0; }
          grep -Fq '87oownPVNFFciRNe2DLaNQPrVsjprbZBX7bHnPENABDyGpM6isrzKeWGsjT5W86h9d6A5nhE2Z2ZAXCHksvC2EikGGaWB8u' README.md || { echo 'README: Monero address missing' >> /tmp/diagnostics.txt; echo 'ready=false' >> "$GITHUB_OUTPUT"; exit 0; }

          if grep -RniE 'general17|tailscale|TS_AUTHKEY|INSTALLER_REVISION|20260809|brand-footnote-fix|SNAPSHOT_SCHEMA_VERSION|supermarkt-preisvergleich-ts|/srv/docker|MIT License' --exclude-dir=.git . > /tmp/private-hits.txt; then
            echo 'Forbidden old/private markers:' >> /tmp/diagnostics.txt
            cat /tmp/private-hits.txt >> /tmp/diagnostics.txt
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Install and verify
        if: steps.prepare.outputs.ready == 'true'
        id: verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee /tmp/pip-upgrade.log
          pip install -e '.[dev]' 2>&1 | tee /tmp/pip-install.log
          python -m compileall -q src tests 2>&1 | tee /tmp/compile.log
          pytest -q -m 'not live' -p no:cacheprovider 2>&1 | tee /tmp/pytest.log

      - name: Record verification failure without another failed notification
        if: steps.prepare.outputs.ready != 'true' || steps.verify.outcome != 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          git reset --hard "$GITHUB_SHA"
          rm -f .repair-result.txt
          {
            echo 'Repository repair did not change main.'
            echo
            echo 'Diagnostics:'
            cat /tmp/diagnostics.txt 2>/dev/null || true
            echo
            echo 'Pytest:'
            tail -n 120 /tmp/pytest.log 2>/dev/null || true
            echo
            echo 'Install:'
            tail -n 80 /tmp/pip-install.log 2>/dev/null || true
          } > .repair-result.txt
          git config user.name 'lesecuritae'
          git config user.email '183674409+lesecuritae@users.noreply.github.com'
          git add .repair-result.txt
          git commit -m 'Repository repair diagnostics' || true
          git push origin HEAD:main

      - name: Replace main with one clean root commit
        if: steps.prepare.outputs.ready == 'true' && steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil
          src = Path('.').resolve()
          dst = Path('/tmp/final-repository')
          if dst.exists():
              shutil.rmtree(dst)
          dst.mkdir()
          expected = [x.strip() for x in Path('/tmp/expected.txt').read_text().splitlines() if x.strip()]
          for rel in expected:
              source = src / rel
              target = dst / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
          PY

          git config user.name 'lesecuritae'
          git config user.email '183674409+lesecuritae@users.noreply.github.com'
          git checkout --orphan clean-main
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/final-repository/. .
          git add -A

          tracked="$(git ls-files | wc -l | tr -d ' ')"
          [[ "$tracked" -eq 53 ]]
          test -f .github/workflows/tests.yml
          ! test -e .repair
          ! test -e .repair-result.txt
          ! test -e .github/workflows/repository-repair.yml

          git commit -m 'Initial release 0.0.1'
          git push --force origin HEAD:main
